# Render Blueprint: деплой всех 10 демо-клонов одной кнопкой.
# Каждый сервис — независимое Node-приложение из своего репозитория.

services:
  - type: web
    name: demo-monkeytype
    runtime: node
    repo: https://github.com/Snowxdxaxd/clone-monkeytype
    branch: main
    plan: free
    buildCommand: npm install
    startCommand: npm start

